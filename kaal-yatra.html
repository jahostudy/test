<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शून्य से उत्तर प्रदेश</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;700;800&family=Khand:wght@400;500;600&family=Mukta:wght@300;400;600&family=Tiro+Devanagari+Hindi:ital@0;1&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: पूरे पर्दे पर स्थिर कैनवस-मंच; कथा-स्तंभ उसके ऊपर बहता है (डेस्कटॉप पर बाएँ, फ़ोन पर नीचे); ऊपर-दाएँ काल-गणक; दाएँ किनारे अध्याय-रेखा */
:root{
  --void:#06050d; --void-2:#0f0c1c; --dust:#f1e7d2; --dust-dim:#b9ae98; --dust-faint:rgba(241,231,210,.16);
  --agni:#ff6a2b; --swarna:#f3b54a; --jal:#46b9c6; --mitti:#c98a52; --epoch:#f3b54a;
  --f-display:"Eczar","Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --f-verse:"Tiro Devanagari Sanskrit","Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --f-lead:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --f-num:"Khand","Mukta","Noto Sans Devanagari",sans-serif;
  color-scheme:dark;
}
html{background:var(--void);scroll-behavior:auto}
body{background:var(--void);color:var(--dust);font-family:var(--f-body);font-size:17px;line-height:1.75;margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:var(--void)}
.veil{position:fixed;left:0;right:0;top:0;height:140px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,5,13,.7),rgba(6,5,13,0))}
main{position:relative;z-index:2;padding-inline:clamp(16px,4vw,64px)}
.ch{position:relative;padding-block:96vh 38vh;--epoch:#f3b54a}
#c0{padding-block:calc(env(safe-area-inset-top,0px) + 13vh) 34vh}

/* प्रस्तावना */
.hero{max-width:40rem}
.kicker{font-family:var(--f-num);font-weight:500;letter-spacing:.14em;font-size:.95rem;color:var(--dust-dim);margin:0 0 1rem}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(3.1rem,9.5vw,7.4rem);line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{display:block;color:var(--swarna)}
.hero .sub{font-family:var(--f-lead);font-size:clamp(1.08rem,1.9vw,1.3rem);line-height:1.75;color:var(--dust);max-width:34rem;margin:1.4rem 0 1.6rem}
.cta{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{font-family:var(--f-num);font-weight:600;font-size:1.05rem;letter-spacing:.05em;color:var(--void);background:var(--swarna);border:0;padding:.65rem 1.25rem .55rem;cursor:pointer;border-radius:2px;transition:transform .2s ease,background .2s ease}
.btn.ghost{background:transparent;color:var(--dust);box-shadow:inset 0 0 0 1px var(--dust-faint)}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.rail button:focus-visible,.dock button:focus-visible{outline:2px solid var(--swarna);outline-offset:3px}
.scrollhint{margin-top:2.2rem;font-family:var(--f-num);letter-spacing:.12em;color:var(--dust-dim);font-size:.95rem;display:flex;align-items:center;gap:.6rem}
.scrollhint i{display:block;width:1px;height:46px;background:linear-gradient(var(--dust-dim),transparent);animation:drip 2.4s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}
.hero + .card{margin-top:62vh}

/* अध्याय-पत्र: ऊपर देवनागरी की शिरोरेखा जैसी मोटी रेखा, जिससे शीर्षक लटकता है */
.card{position:relative;max-width:35rem;padding:1.9rem clamp(1.1rem,2.4vw,2rem) 1.6rem;background:rgba(8,7,16,.8);-webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15);box-shadow:0 40px 90px rgba(0,0,0,.55)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--epoch)}
.eyebrow{font-family:var(--f-num);font-weight:500;font-size:.92rem;letter-spacing:.14em;color:var(--epoch);margin:0 0 .3rem}
.card h2{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,4.4vw,3.15rem);line-height:1.15;margin:0 0 .35rem;text-wrap:balance}
.when{font-family:var(--f-num);font-weight:600;font-size:1.25rem;letter-spacing:.04em;color:var(--dust-dim);margin:0 0 1.1rem;font-variant-numeric:tabular-nums}
.when b{color:var(--dust);font-weight:600}
.verse{font-family:var(--f-verse);font-size:clamp(1.25rem,2.3vw,1.6rem);line-height:1.8;color:var(--epoch);margin:0 0 .3rem;text-wrap:balance}
.verse-src{font-family:var(--f-num);font-size:.95rem;letter-spacing:.06em;color:var(--dust-dim);margin:0 0 1.1rem}
.lead{font-family:var(--f-lead);font-style:italic;font-size:clamp(1.1rem,1.7vw,1.24rem);line-height:1.8;margin:0 0 1.2rem;color:var(--dust)}
.facts{margin:0 0 1.2rem;padding-left:1.7rem;list-style-type:devanagari;display:grid;gap:.55rem}
.facts li{padding-left:.25rem;color:#e8decb}
.facts li::marker{font-family:var(--f-num);font-weight:600;color:var(--epoch)}
.facts b{color:var(--dust);font-weight:600}
.exam{margin:0;padding:.85rem 1rem .8rem;background:rgba(243,181,74,.08);box-shadow:inset 0 0 0 1px rgba(243,181,74,.22);font-size:.98rem;line-height:1.7}
.exam span{display:block;font-family:var(--f-num);font-weight:600;letter-spacing:.14em;font-size:.85rem;color:var(--swarna);margin-bottom:.15rem}
.restart{margin-top:1.4rem}

/* काल-गणक */
.hud{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 14px);right:64px;text-align:right;pointer-events:none;max-width:60vw}
.hud .part{font-family:var(--f-num);font-weight:500;font-size:.85rem;letter-spacing:.2em;color:var(--epoch);margin:0}
.hud .yrs{font-family:var(--f-num);font-weight:600;font-size:clamp(2.3rem,5.4vw,4.4rem);line-height:1;margin:.1rem 0 0;font-variant-numeric:tabular-nums;color:var(--dust);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hud .unit{font-family:var(--f-num);font-weight:500;font-size:1.05rem;letter-spacing:.06em;color:var(--dust-dim);margin:.15rem 0 .45rem}
.hud .meta{font-family:var(--f-num);font-size:.92rem;letter-spacing:.04em;color:var(--dust-dim);margin:0;font-variant-numeric:tabular-nums;line-height:1.5}
.brand{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:clamp(16px,4vw,64px);font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.02em;color:var(--dust);margin:0;opacity:.85}
.brand small{font-family:var(--f-num);font-weight:500;letter-spacing:.16em;color:var(--dust-dim);font-size:.8rem;margin-left:.5rem}

/* अध्याय-रेखा */
.rail{position:fixed;z-index:3;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.rail button{position:relative;display:block;width:22px;height:14px;padding:0;border:0;background:transparent;cursor:pointer}
.rail button::before{content:"";position:absolute;right:4px;top:6px;width:10px;height:2px;background:var(--dust-faint);transition:width .3s ease,background .3s ease}
.rail button.on::before{width:20px;background:var(--epoch)}
.rail button.gap{margin-top:10px}
.rail button span{position:absolute;right:30px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--f-num);font-size:.9rem;letter-spacing:.04em;color:var(--dust);background:rgba(8,7,16,.9);padding:.15rem .55rem;opacity:0;pointer-events:none;transition:opacity .2s}
.rail button:hover span,.rail button:focus-visible span{opacity:1}
.bar{position:fixed;z-index:3;left:0;top:0;height:3px;width:0;background:var(--epoch);display:none}

/* नियंत्रण */
.dock{position:fixed;z-index:3;right:clamp(16px,3vw,28px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:.5rem}
.dock button{font-family:var(--f-num);font-weight:600;font-size:.98rem;letter-spacing:.05em;color:var(--dust);background:rgba(8,7,16,.78);border:0;box-shadow:inset 0 0 0 1px var(--dust-faint);padding:.5rem .9rem .42rem;cursor:pointer;border-radius:2px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dock button[aria-pressed="true"]{color:var(--void);background:var(--swarna);box-shadow:none}

@media (max-width:899px){
  body{font-size:16px}
  .ch{padding-block:78vh 30vh}
  #c0{padding-block:calc(env(safe-area-inset-top,0px) + 50vh) 26vh}
  .hero + .card{margin-top:46vh}
  .card{max-width:none;background:rgba(8,7,16,.86)}
  .hud{right:16px;max-width:62vw}
  .hud .meta{font-size:.8rem}
  .rail{display:none}
  .bar{display:block}
  .brand small{display:none}
  .veil{height:180px;background:linear-gradient(180deg,rgba(6,5,13,.97) 0,rgba(6,5,13,.92) 58%,rgba(6,5,13,0) 100%);z-index:3}
  .hud,.brand,.bar{z-index:4}
}
@media (max-width:420px){.hud .meta.clock{display:none}}
@media (prefers-reduced-motion:reduce){.scrollhint i{animation:none}.btn{transition:none}}

/* फ़िल्म-मोड */
html,body{height:100%;overflow:hidden}
.cap{position:fixed;z-index:3;left:clamp(16px,4vw,64px);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);max-width:min(40rem,calc(100vw - 32px));pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease}
.cap.on{opacity:1;transform:none}
.cap-k{font-family:var(--f-num);font-weight:500;letter-spacing:.2em;font-size:.9rem;color:var(--epoch);margin:0 0 .2rem}
.cap-t{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.08;margin:0;text-shadow:0 4px 30px rgba(0,0,0,.8);text-wrap:balance}
.cap-s{font-family:var(--f-num);font-weight:500;font-size:clamp(1.1rem,2.2vw,1.55rem);letter-spacing:.04em;color:var(--epoch);margin:.4rem 0 0;text-shadow:0 2px 16px rgba(0,0,0,.9)}
.intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;padding-inline:clamp(16px,6vw,96px);background:radial-gradient(ellipse at 64% 50%,rgba(6,5,13,.1),rgba(6,5,13,.85) 70%);transition:opacity .8s ease}
.intro h1{font-family:var(--f-display);font-weight:800;font-size:clamp(3.1rem,10vw,7.6rem);line-height:1.02;margin:0 0 2rem;text-wrap:balance}
.intro h1 span{display:block;color:var(--swarna)}
.intro.gone{opacity:0;pointer-events:none}
.ctrl{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:0 clamp(16px,4vw,64px) calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:14px;background:linear-gradient(0deg,rgba(6,5,13,.75),rgba(6,5,13,0))}
.tl{flex:1;display:flex;gap:3px;height:28px;align-items:center;min-width:0}
.tl button{flex:1;height:28px;padding:0;border:0;background:transparent;cursor:pointer;position:relative}
.tl button::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;background:rgba(241,231,210,.16)}
.tl button i{position:absolute;left:0;top:12px;height:4px;width:0;background:var(--epoch)}
.tl button.gap{margin-left:8px}
.tl button:focus-visible{outline:2px solid var(--swarna)}
.ctrl .dock{position:static;display:flex;gap:.4rem}
.dock button{min-width:2.4rem}
@media (max-width:899px){.cap{bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}.ctrl{flex-direction:column;align-items:stretch;gap:6px}.ctrl .dock{justify-content:flex-end}}
</style>

<script>
'use strict';
/* ===================== मूल उपकरण ===================== */
const $=s=>document.querySelector(s);
const cv=$('#sky'), mainCtx=cv.getContext('2d');
const offCv=document.createElement('canvas'), offCtx=offCv.getContext('2d');
let X=mainCtx, W=0,H=0,DPR=1,CX=0,CY=0,S=0,WIDE=false;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PI=Math.PI, TAU=PI*2, D2R=PI/180;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=t=>1-Math.pow(1-clamp(t),3);

function palGen(o,out){for(let i=0;i<256;i++){const h=i/255;let c;
  if(o.india&&h>=.9)c=[243,181,74];
  else if(h<o.sea){const d=h/Math.max(o.sea,.001);c=mixC(o.deep,o.shallow,d*d)}
  else{const d=(h-o.sea)/(1-o.sea);c=mixC(o.low,o.high,Math.min(1,d*1.8));if(o.coast&&d<o.cw)c=mixC(o.coast,c,d/o.cw)}
  if(o.ice)c=mixC(c,[232,242,250],o.ice);out.r[i]=c[0];out.g[i]=c[1];out.b[i]=c[2]}return out}
function palMagma(cool,out,em){const thr=lerp(.64,.36,cool);for(let i=0;i<256;i++){const h=i/255;let c,e=[0,0,0];
  if(h<thr){const d=clamp((thr-h)/.3);c=mixC([255,214,120],[190,40,10],d);e=mixC([255,170,60],[150,25,5],d).map(v=>v*(1-cool*.75)*.85);c=c.map(v=>v*.5)}

  out.r[i]=c[0];out.g[i]=c[1];out.b[i]=c[2];em.r[i]=e[0];em.g[i]=e[1];em.b[i]=e[2]}}
